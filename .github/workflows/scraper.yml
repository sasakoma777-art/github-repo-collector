name: Daily GitHub Repo Collector

on:
  schedule:
    - cron: '0 */6 * * *'  # 0時、6時、12時、18時（UTC）に自動実行
  workflow_dispatch: # GitHubの画面から手動実行も可能

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリのインストール
        run: |
          pip install -r requirements.txt

      - name: 収集スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
          GCP_CREDS_JSON: ${{ secrets.GCP_CREDS_JSON }}
        run: |
          python main.py
